name: Deploy Day Book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "daybook/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for this repo the first time it runs,
      # so there is nothing to click in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only daybook/ is published, so the app sits at the site root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: daybook

      - id: deployment
        uses: actions/deploy-pages@v4
